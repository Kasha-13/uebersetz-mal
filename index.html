<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">

<title>Übersetz mal</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✍️</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,600;12..96,800&family=Kalam:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F7F9FB; --grid:#D3E0EC; --margin:#D64545; --ink:#1F3A93;
  --text:#22262B; --muted:#5E6873; --ok:#1E7A4C; --card:#FFFFFF;
  --sans:"Bricolage Grotesque",system-ui,-apple-system,"Segoe UI",sans-serif;
  --hand:"Kalam","Comic Sans MS","Segoe Print",cursive;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root{--paper:#161B22;--grid:#26303C;--margin:#E06A6A;--ink:#8FB3FF;--text:#E6EAF0;--muted:#97A3B1;--ok:#5CCB8F;--card:#1C232C}
}
*,*::before,*::after{box-sizing:inherit}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--text);font-family:var(--sans);font-size:17px;line-height:1.5}
.wrap{max-width:560px;margin:0 auto;padding:20px 16px 32px}
header{display:flex;justify-content:space-between;align-items:baseline;gap:12px;margin-bottom:16px}
h1{font-size:28px;font-weight:800;margin:0;letter-spacing:-.02em}
.score{color:var(--muted);font-size:15px}
.levels{display:flex;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.levels button{font:600 15px var(--sans);padding:6px 14px;border-radius:999px;border:1.5px solid var(--grid);background:transparent;color:var(--text);cursor:pointer}
.levels button[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}

/* the exercise-book card */
.card{position:relative;background-color:var(--card);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:20px 20px;border-radius:6px;padding:22px 20px 22px 44px;
  box-shadow:0 1px 0 var(--grid),0 8px 24px -12px rgba(31,58,147,.25)}
.card::before{content:"";position:absolute;top:0;bottom:0;left:30px;width:2px;background:var(--margin);opacity:.7}
.tag{font-size:14px;color:var(--muted);margin:0 0 6px}
.en{font-size:24px;font-weight:600;line-height:1.3;margin:0 0 18px}
textarea{width:100%;min-height:96px;font:400 22px/1.4 var(--hand);color:var(--ink);background:transparent;border:none;border-bottom:2px solid var(--ink);resize:vertical;padding:4px 0;outline:none}
textarea::placeholder{color:var(--muted);opacity:.7}
textarea:focus-visible{border-bottom-color:var(--margin)}
.keys{display:flex;gap:6px;margin:10px 0 0;flex-wrap:wrap}
.keys button{font:600 18px var(--sans);width:42px;height:40px;border-radius:8px;border:1.5px solid var(--grid);background:var(--card);color:var(--text);cursor:pointer}

.actions{display:flex;gap:10px;margin-top:18px;flex-wrap:wrap}
.btn{font:600 17px var(--sans);padding:12px 18px;border-radius:10px;border:none;cursor:pointer;flex:1;min-width:120px}
.primary{background:var(--ink);color:var(--paper)}
.ghost{background:transparent;color:var(--text);border:1.5px solid var(--grid)}
.good{background:var(--ok);color:#fff}
.bad{background:var(--margin);color:#fff}
button:focus-visible{outline:3px solid var(--margin);outline-offset:2px}

.answer{display:none;margin-top:20px;padding-top:16px;border-top:2px dashed var(--grid)}
.answer.show{display:block;animation:in .25s ease-out}
@keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.de{font-size:22px;font-weight:600;color:var(--text);margin:0 0 4px;display:flex;gap:10px;align-items:flex-start}
.de span{flex:1}
.speak{font-size:20px;background:none;border:none;cursor:pointer;padding:0 4px;line-height:1.2}
.alt{color:var(--muted);font-size:15px;margin:0 0 6px}
.yours{font:400 20px/1.4 var(--hand);color:var(--ink);margin:4px 0 0}
.yours .hit{text-decoration:underline;text-decoration-color:var(--ok);text-decoration-thickness:3px;text-underline-offset:3px}
.yours .miss{text-decoration:line-through;text-decoration-color:var(--margin);text-decoration-thickness:2px}
.legend{color:var(--muted);font-size:14px;margin:6px 0 0}

footer{margin-top:20px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;color:var(--muted);font-size:15px}
footer button{font:600 15px var(--sans);background:none;border:none;color:var(--ink);cursor:pointer;padding:4px 0;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:reduce){.answer.show{animation:none}}

.gram{font-size:15px;margin:0 0 14px;padding:6px 10px;border-left:3px solid var(--ink);background:color-mix(in srgb,var(--ink) 8%,transparent)}
.feedback{display:none;font-size:16px;white-space:pre-wrap;margin:12px 0 0;padding:10px 12px;border-radius:8px;border:1.5px solid var(--grid);background:var(--card)}
.feedback.show{display:block}
.small{font:600 15px var(--sans);padding:8px 14px;border-radius:8px;border:1.5px solid var(--ink);background:transparent;color:var(--ink);cursor:pointer;margin-top:12px}
.small:disabled{opacity:.5;cursor:default}
.status{color:var(--muted);font-size:14px;margin:12px 0 0;min-height:1.2em}
.en.loading{color:var(--muted);font-weight:400}
details{margin-top:24px;border-top:1.5px solid var(--grid);padding-top:12px}
summary{font-weight:600;cursor:pointer;padding:4px 0}
.set{display:grid;gap:12px;margin-top:12px}
.set label{display:grid;gap:4px;font-size:15px;color:var(--muted)}
.set input,.set select{font:400 16px var(--sans);padding:10px;border-radius:8px;border:1.5px solid var(--grid);background:var(--card);color:var(--text);width:100%}
.set p{font-size:14px;color:var(--muted);margin:0}
.set a{color:var(--ink)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>Übersetz mal</h1>
    <div class="score" id="score"></div>
  </header>

  <div class="levels" role="group" aria-label="Level">
    <button data-l="all" aria-pressed="true">All</button>
    <button data-l="A2" aria-pressed="false">A2</button>
    <button data-l="B1" aria-pressed="false">B1</button>
  </div>

  <main class="card">
    <p class="tag" id="tag"></p>
    <p class="en" id="en"></p>
    <label for="guess" class="tag">Your German</label>
    <textarea id="guess" placeholder="Schreib hier…" autocapitalize="sentences" spellcheck="false"></textarea>
    <div class="keys" aria-label="Special letters">
      <button>ä</button><button>ö</button><button>ü</button><button>ß</button><button>Ä</button><button>Ö</button><button>Ü</button>
    </div>

    <div class="actions" id="askRow">
      <button class="btn primary" id="reveal">Show answer</button>
      <button class="btn ghost" id="skip">Skip</button>
    </div>

    <section class="answer" id="answer" aria-live="polite">
      <p class="de"><span id="de"></span><button class="speak" id="speak" aria-label="Hear it in German">🔊</button></p>
      <p class="alt" id="alt"></p>
      <p class="gram" id="gram"></p>
      <p class="tag">You wrote</p>
      <p class="yours" id="yours"></p>
      <button class="small" id="check">Check my answer</button>
      <div class="feedback" id="feedback"></div>
      <div class="actions">
        <button class="btn good" id="gotIt">I got it</button>
        <button class="btn bad" id="missed">Practice again</button>
      </div>
    </section>
  </main>
  <p class="status" id="status" aria-live="polite"></p>

  <footer>
    <span id="pool"></span>
    <button id="mode">Practise my missed sentences</button>
  </footer>

  <details id="settings">
    <summary>Settings: AI sentences</summary>
    <div class="set">
      <p>Add a free API key to get endless new sentences. The key is saved only in this browser on this device, never in the code on GitHub.</p>
      <label>Provider
        <select id="provider">
          <option value="gemini">Google Gemini (free tier)</option>
          <option value="groq">Groq (free tier)</option>
        </select>
      </label>
      <p id="keyHelp"></p>
      <label>API key <input id="apikey" type="password" autocomplete="off" placeholder="Paste your key"></label>
      <label>Model <input id="model" autocomplete="off"></label>
      <div class="actions" style="margin-top:0">
        <button class="btn primary" id="saveSet">Save and start</button>
        <button class="btn ghost" id="clearKey">Remove key</button>
      </div>
    </div>
  </details>
</div>

};

/* ---------- what the AI is asked to practise ---------- */
const TOPICS = ["shopping","café or restaurant","doctor or pharmacy","making or changing an appointment","trains, buses and directions","flat, landlord or neighbours","work and colleagues","phone calls and messages","Bürgeramt and paperwork","free time and hobbies","small talk","weekend plans","the weather","cooking and groceries","travel and holidays","bank or post office","sport and the gym","family and friends","giving an opinion","a small problem or complaint","invitations and parties","online orders and deliveries"];
const GRAMMAR = {
  A2:["Perfekt with haben","Perfekt with sein","separable verbs","modal verbs (können, müssen, dürfen, sollen, wollen)","dative pronouns (mir, dir, ihm…)","weil-clause","wenn-clause","dass-clause","comparative with als","reflexive verbs","two-way prepositions (in, an, auf + Akk/Dat)","infinitive with zu","Präteritum of sein, haben and modal verbs","imperative","seit + present tense","verbs with dative (helfen, gefallen, gehören, passen)"],
  B1:["Konjunktiv II for polite requests","Konjunktiv II for hypotheticals (wenn ich … wäre/hätte)","passive in present tense","passive in past tense (wurde)","passive with a modal verb","relative clause","indirect question (ob / W-word)","obwohl-clause","nachdem + Plusquamperfekt","während- or bevor-clause","sobald-clause","je … desto","da-compounds (darüber, davon, damit)","verbs with fixed prepositions (sich freuen auf, warten auf, denken an)","um … zu / statt … zu","prepositions with genitive (wegen, trotz, während)","sondern / nicht nur … sondern auch","Konjunktiv II in the past (hätte … gemacht)"]
};
const DEFAULT_MODEL = {gemini:"gemini-2.5-flash", groq:"llama-3.3-70b-versatile"};
const pick = a => a[Math.floor(Math.random()*a.length)];

let cfg = store.get("cfg",{provider:"gemini",key:"",model:DEFAULT_MODEL.gemini});
let level = store.get("level","all");
let missed = store.get("missed_v3",[]);          // list of sentence objects
let recent = store.get("recent",[]);             // recent English sentences, to avoid repeats
let stats = store.get("stats",{right:0,total:0});
let missedMode = false, current = null, prefetch = null, bankDeck = [];
let coolUntil = store.get("coolUntil",0);        // when AI sentences may be tried again

/* ---------- LLM calls ---------- */
class LimitError extends Error{ constructor(msg,wait){super(msg);this.wait=wait} }

// Turns a failed response into a normal error, or a LimitError with how long to wait
function failure(status, d){
  const msg = d.error?.message || "request failed";
  if(status===429){
    const daily = /per ?day|daily|PerDay|tokens per day|requests per day/i.test(JSON.stringify(d));
    const hint = (d.error?.details||[]).find(x=>x.retryDelay)?.retryDelay       // Gemini: "37s"
              || (msg.match(/try again in ([\d.]+)s/i)||[])[1];                  // Groq: "try again in 12.5s"
    const secs = parseFloat(hint) || 60;
    return new LimitError(daily ? "daily free limit reached" : "free limit reached", daily ? 60*60*1000 : Math.max(secs,20)*1000);
  }
  if(status===503 || status===500) return new LimitError("the AI service is busy", 30*1000);
  return new Error(`${status}: ${msg}`);
}

async function callLLM(prompt, json){
  const ctrl = new AbortController(), timer = setTimeout(()=>ctrl.abort(), 15000);
  try{ return await rawCall(prompt, json, ctrl.signal); }
  catch(e){ if(e.name==="AbortError") throw new LimitError("the AI took too long", 30*1000); throw e; }
  finally{ clearTimeout(timer); }
}

async function rawCall(prompt, json, signal){
  if(cfg.provider==="gemini"){
    const r = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model)}:generateContent`,{
      method:"POST", signal,
      headers:{"Content-Type":"application/json","x-goog-api-key":cfg.key},
      body:JSON.stringify({contents:[{parts:[{text:prompt}]}],
        generationConfig:{temperature:1, ...(json?{responseMimeType:"application/json"}:{})}})
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw failure(r.status, d);
    return (d.candidates?.[0]?.content?.parts||[]).map(p=>p.text||"").join("");
  } else {
    const r = await fetch("https://api.groq.com/openai/v1/chat/completions",{
      method:"POST", signal,
      headers:{"Content-Type":"application/json","Authorization":`Bearer ${cfg.key}`},
      body:JSON.stringify({model:cfg.model,temperature:1,messages:[{role:"user",content:prompt}],
        ...(json?{response_format:{type:"json_object"}}:{})})
    });
    const d = await r.json().catch(()=>({}));
    if(!r.ok) throw failure(r.status, d);
    return d.choices?.[0]?.message?.content||"";
  }
}

async function generate(){
  const lv = level==="all" ? pick(["A2","B1"]) : level;
  const topic = pick(TOPICS), gram = pick(GRAMMAR[lv]);
  const prompt = `You create translation exercises for an adult who lives in Germany and is learning German (CEFR ${lv}).
Write ONE natural English sentence that a person would really say in everyday life.
Topic: ${topic}. The German translation must use this grammar: ${gram}.
Use common, everyday vocabulary at level ${lv}. 6 to 16 words. Vary the people, places and situations.
Do not reuse any of these sentences: ${recent.slice(-15).join(" | ") || "none"}
Return only JSON with these keys:
{"en": the English sentence,
 "de": the natural German translation a native speaker would say,
 "alt": one other fully correct German version (e.g. Sie/du form or different word order), or "" if none,
 "grammar": one short English line naming the grammar point and the key form used,
 "topic": a 1-3 word English topic label}`;
  const raw = await callLLM(prompt,true);
  const o = JSON.parse(raw.replace(/```json|```/g,"").trim());
  if(!o.en||!o.de) throw new Error("the model returned an incomplete sentence");
  return {lv,topic:o.topic||topic,en:o.en,de:o.de,alt:o.alt||"",grammar:o.grammar||gram,src:"ai"};
}

function fromBank(){
  if(!bankDeck.length){
    bankDeck = S.map((s,i)=>i).filter(i=>level==="all"||S[i][0]===level);
    for(let i=bankDeck.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[bankDeck[i],bankDeck[j]]=[bankDeck[j],bankDeck[i]]}
  }
  const [lv,topic,en,de,grammar,alt]=S[bankDeck.pop()];
  return {lv,topic,en,de,grammar,alt:alt||"",src:"bank"};
}

function waitText(){
  const m = Math.ceil((coolUntil-Date.now())/60000);
  return m<=1 ? "in about a minute" : m<60 ? `in about ${m} minutes` : "in about an hour";
}
function coolDown(e){
  coolUntil = Date.now() + e.wait; store.set("coolUntil",coolUntil); prefetch = null;
}

async function getItem(){
  if(missedMode) return missed.length ? pick(missed) : null;
  if(!cfg.key){ status("Using built-in sentences. Add a free API key in Settings for endless new ones."); return fromBank(); }
  if(Date.now() < coolUntil){
    status(`Free AI limit reached, so you're seeing built-in sentences. AI sentences come back ${waitText()}.`);
    return fromBank();
  }
  try{ const it = await generate(); status(""); return it; }
  catch(e){
    if(e instanceof LimitError){
      coolDown(e);
      status(`${e.message[0].toUpperCase()+e.message.slice(1)}, so you're seeing built-in sentences. AI sentences come back ${waitText()}.`);
    } else status(`Couldn't get a new sentence (${e.message}). Showing a built-in one instead.`);
    return fromBank();
  }
}

/* ---------- flow ---------- */
function status(t){ $("status").textContent=t }

async function next(){
  $("answer").classList.remove("show"); $("feedback").classList.remove("show");
  $("askRow").style.display="none"; $("guess").value=""; $("tag").textContent="";
  $("en").textContent="Writing a new sentence…"; $("en").classList.add("loading");
  const p = prefetch || getItem(); prefetch = null;
  current = await p;
  $("en").classList.remove("loading");
  if(!current){
    $("en").textContent="No missed sentences yet. Switch back to all sentences to keep going.";
    render(); return;
  }
  if(current.src==="ai"){ recent.push(current.en); recent=recent.slice(-30); store.set("recent",recent); }
  $("tag").textContent = `${current.lv} · ${current.topic}` + (missed.some(m=>m.en===current.en)?" · practising again":"");
  $("en").textContent = current.en;
  $("askRow").style.display="";
  render();
  if(!missedMode && cfg.key) prefetch = getItem();   // write the next one while you type
}

const norm = w => w.toLowerCase().replace(/[.,!?;:"„“”()]/g,"");
function reveal(){
  if(!current) return;
  $("de").textContent = current.de;
  $("alt").textContent = current.alt ? "Also fine: " + current.alt : "";
  $("gram").textContent = "Grammar: " + current.grammar;
  const ref = new Set((current.de+" "+current.alt).split(/\s+/).map(norm).filter(Boolean));
  const g = $("guess").value.trim(), out = $("yours"); out.innerHTML="";
  if(!g) out.textContent="(nothing yet)";
  else g.split(/\s+/).forEach((w,i)=>{const s=document.createElement("span");s.textContent=w;s.className=ref.has(norm(w))?"hit":"miss";if(i)out.append(" ");out.append(s)});
  $("check").style.display = (cfg.key && g) ? "" : "none";
  $("check").disabled=false; $("check").textContent="Check my answer";
  $("askRow").style.display="none"; $("answer").classList.add("show");
}

async function check(){
  const btn=$("check"), fb=$("feedback");
  btn.disabled=true; btn.textContent="Checking…";
  const prompt = `A learner of German (CEFR ${current.lv}) translated an English sentence.
English: ${current.en}
Reference German: ${current.de}${current.alt?` / ${current.alt}`:""}
Learner's German: ${$("guess").value.trim()}
Judge the learner's German on its own merits; other word orders, synonyms or du/Sie forms are fine if correct.
Reply in plain English text, no markdown, at most 5 short lines.
Line 1: exactly one of "Correct", "Almost", "Not quite".
Then one line per mistake: the wrong part → the corrected part, and a short reason (case, verb position, ending, word choice…).
If it is correct, add one short line of praise or a tip for sounding more natural.`;
  if(Date.now() < coolUntil){
    fb.textContent = `The free AI limit is reached, so checking is paused. It comes back ${waitText()}. Compare with the answer above for now.`;
  } else {
    try{ fb.textContent = (await callLLM(prompt,false)).trim(); }
    catch(e){
      if(e instanceof LimitError){ coolDown(e); fb.textContent = `${e.message[0].toUpperCase()+e.message.slice(1)}, so checking is paused. It comes back ${waitText()}.`; }
      else fb.textContent = `Couldn't check your answer (${e.message}).`;
    }
  }
  fb.classList.add("show"); btn.textContent="Checked";
}

function grade(ok){
  stats.total++; if(ok) stats.right++;
  missed = missed.filter(m=>m.en!==current.en);
  if(!ok) missed.push(current);
  store.set("stats",stats); store.set("missed_v3",missed);
  next();
}

function render(){
  $("score").textContent = stats.total ? `${stats.right} / ${stats.total} right` : "";
  $("pool").textContent = `${missed.length} to practise again`;
  $("mode").textContent = missedMode ? "Back to new sentences" : "Practise my missed sentences";
  document.querySelectorAll(".levels button").forEach(b=>b.setAttribute("aria-pressed",b.dataset.l===level));
}

function speak(){
  if(!("speechSynthesis" in window)||!current) return;
  const u=new SpeechSynthesisUtterance(current.de); u.lang="de-DE"; u.rate=.9;
  const v=speechSynthesis.getVoices().find(v=>v.lang.startsWith("de")); if(v) u.voice=v;
  speechSynthesis.cancel(); speechSynthesis.speak(u);
}

/* ---------- settings ---------- */
const HELP = {
  gemini:'Get a free key at <a href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">aistudio.google.com/apikey</a>.',
  groq:'Get a free key at <a href="https://console.groq.com/keys" target="_blank" rel="noopener">console.groq.com/keys</a>.'
};
function fillSettings(){
  $("provider").value=cfg.provider; $("apikey").value=cfg.key; $("model").value=cfg.model;
  $("keyHelp").innerHTML=HELP[cfg.provider];
  if(!cfg.key) $("settings").open=true;
}
$("provider").onchange=()=>{
  const p=$("provider").value; $("keyHelp").innerHTML=HELP[p];
  if(Object.values(DEFAULT_MODEL).includes($("model").value)) $("model").value=DEFAULT_MODEL[p];
};
$("saveSet").onclick=()=>{
  cfg={provider:$("provider").value,key:$("apikey").value.trim(),model:$("model").value.trim()||DEFAULT_MODEL[$("provider").value]};
  store.set("cfg",cfg); coolUntil=0; store.set("coolUntil",0); prefetch=null; $("settings").open=false; next();
};
$("clearKey").onclick=()=>{ cfg.key=""; store.set("cfg",cfg); $("apikey").value=""; prefetch=null; next(); };

/* ---------- wiring ---------- */
$("reveal").onclick=reveal;
$("skip").onclick=next;
$("check").onclick=check;
$("gotIt").onclick=()=>grade(true);
$("missed").onclick=()=>grade(false);
$("speak").onclick=speak;
$("mode").onclick=()=>{missedMode=!missedMode; prefetch=null; next()};
document.querySelectorAll(".levels button").forEach(b=>b.onclick=()=>{level=b.dataset.l;store.set("level",level);prefetch=null;bankDeck=[];next()});
document.querySelectorAll(".keys button").forEach(b=>b.onclick=()=>{
  const t=$("guess"),s=t.selectionStart,e=t.selectionEnd;
  t.value=t.value.slice(0,s)+b.textContent+t.value.slice(e); t.focus(); t.selectionStart=t.selectionEnd=s+1;
});
$("guess").addEventListener("keydown",e=>{if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();reveal()}});

fillSettings(); next();
</script>
</body>
</html>
